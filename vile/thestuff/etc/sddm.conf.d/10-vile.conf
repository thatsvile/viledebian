[General]
# Debian SDDM defaults to qtvirtualkeyboard; clear it so non-breeze themes
# (like vile) are not covered by a fullscreen on-screen keyboard.
InputMethod=
# Greeter display server only — does not choose the user session. Keep root
# X11: DisplayServer=wayland fails on NVIDIA and falls back to x11-user
# (-novtswitch), leaving a blank VT while niri starts on another.
DisplayServer=x11

[Theme]
Current=vile
